apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ template "gorush.fullname" . }}
  labels:
    app: {{ template "gorush.name" . }}
    chart: {{ template "gorush.chart" . }}
    release: {{ .Release.Name }}
    heritage: {{ .Release.Service }}
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    rollingUpdate:
      maxSurge: {{ .Values.strategy.maxSurge }}
      maxUnavailable: {{ .Values.strategy.maxUnavailable }}
    type: {{ .Values.strategy.type }}
  selector:
    matchLabels:
      app: {{ template "gorush.name" . }}
      release: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app: {{ template "gorush.name" . }}
        release: {{ .Release.Name }}
    spec:
      containers:
      - env:
        - name: EEN_DHASH_ADDRESS
          value: {{ .Values.eenDhashAddress }}
        - name: EEN_IOS_PROD_CERT
          value: {{ .Values.secret.iosProdCert }}
        - name: EEN_ANDROID_PROD_KEY
          value: {{ .Values.secret.androidApiKey}}
        image: {{ .Values.image.repository }}:{{ tpl .Values.image.tag . }}
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        name: {{ .Chart.Name }}
        ports:
        - containerPort: {{ .Values.ports.containerPort }}
          protocol: {{ .Values.ports.protocol }}
        resources:
{{ toYaml .Values.resources | indent 10 }}
      dnsPolicy: {{ .Values.dnsPolicy }}
    {{- with .Values.nodeSelector }}
      nodeSelector:
{{ toYaml . | indent 8 }}
    {{- end }}
    {{- if or .Values.affinity .Values.podAntiAffinity.enabled }}
      affinity:
    {{- with .Values.affinity }}
{{ toYaml . | indent 8 }}
    {{- end }}
    {{- if .Values.podAntiAffinity.enabled }}
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchLabels:
                app: {{ template "gorush.name" . }}
                release: {{ .Release.Name }}
            topologyKey: kubernetes.io/hostname
    {{- end }}
    {{- end }}
    {{- with .Values.tolerations }}
      tolerations:
{{ toYaml . | indent 8 }}
    {{- end }}
    {{- with .Values.securityContext }}
      securityContext: {{ .Values.securityContext }}
    {{- end }}
